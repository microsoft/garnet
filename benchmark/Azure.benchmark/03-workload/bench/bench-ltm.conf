# Paired NVMe workload: garnet-nvme-memory.conf for RAM, garnet-nvme.conf for disk.

# SSH connection
SshUser=guser
ClientMachineCount=[1]
ClientMachineHostnames=[vm0.d128ldsv6.australiaeast.cloudapp.azure.com]
Multiplier=1

# Benchmark parameters
Server=10.5.128.5
Port=7000
Threads=128
Runtime=120
ClusterBench=true
UseFixedWorkerPool=true
UseParallelFanOut=false

# 16 Mi keys with 2 KiB values: 32 GiB of values for both server profiles.
# Fits the 64 GiB memory baseline; exceeds the 4 GiB disk profile by 8x.
DbSize=16777216
KeyLength=16
ValueLength=2048
BatchSize=1

# Preloads the dataset; add --skipload only after this key range is populated.
ExtraArgs=--online --itp 64 --op-workload GET,SET --op-percent 80,20 --replica-ops-percent 0 --workload-seed 20261104 --disable-console-logger
