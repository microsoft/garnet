# TLS cluster benchmark configuration
# Lines starting with # are comments

# SSH connection
SshUser=guser
ClientMachineCount=[4]
ClientMachineHostnames=[vm0.client16core.southcentralus.cloudapp.azure.com]
Multiplier=1

# Benchmark parameters
Server=10.5.128.4
Port=7000
Threads=16
Runtime=15
ClusterBench=true
Tls=true
TlsHost=azurebench-server

# Use Threads workers across all shards, each with a provider per shard.
# If false, use Threads workers per shard.
UseFixedWorkerPool=true

# Send to every shard before waiting for responses.
UseParallelFanOut=false

# Operation type (optional, e.g., GET, SET, MGET, MSET)
Op=SET

# Data parameters
DbSize=13514
KeyLength=8
ValueLength=100
BatchSize=4096

# Additional arguments (optional)
ExtraArgs=--replica-ops-percent 0 --offline-buffers 128
