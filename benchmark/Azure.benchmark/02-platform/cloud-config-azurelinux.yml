#cloud-config
write_files:
  - path: /etc/profile.d/aliases.sh
    permissions: '0644'
    content: |
      alias ll='ls -la'
  - path: /etc/profile.d/dotnet-tools.sh
    permissions: '0644'
    content: |
      export PATH="$PATH:$HOME/.dotnet/tools"
  - path: /opt/deploy-actions/keyvault.env
    permissions: '0644'
    content: |
      VAULT_NAME=__KEYVAULT_NAME__
  - path: /opt/deploy-actions/storage.env
    permissions: '0644'
    content: |
      TOOLS_BLOB_URL=__TOOLS_BLOB_URL__
  - path: /opt/deploy-actions/deployment.env
    permissions: '0644'
    content: |
      DEPLOYMENT_ROLE=__DEPLOYMENT_ROLE__

runcmd:
  # Install all build dependencies
  - sudo tdnf install -y git vim tar gzip wget curl grep sed make cmake gcc gcc-c++ binutils glibc-devel pkg-config net-tools autoconf automake libtool openssl-devel zlib-devel util-linux-devel icu libxml2-devel jemalloc-devel liburing liburing-devel libaio libaio-devel libevent-devel glibc-devel
  - sudo tdnf install -y kernel-headers glibc-devel gcc-c++
  - sudo tdnf install -y tcpdump pciutils jq iperf3 ethtool powershell

  # Fetch the tools bundle (tools.tar.gz) from the shared storage account using the
  # VMSS managed identity (Storage Blob Data Reader; Shared Key/SAS is disabled), then
  # extract it to /home/guser/tools and run the installer. Retries for ~10 minutes
  # while the role assignment propagates.
  - |
    for i in $(seq 1 40); do
      TOKEN=$(curl -s -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://storage.azure.com/" | jq -r '.access_token // empty')
      if [ -n "$TOKEN" ]; then
        AUTHSCHEME=Bearer
        if curl -fsSL -H "Authorization: $AUTHSCHEME $TOKEN" -H "x-ms-version: 2023-11-03" "__TOOLS_BLOB_URL__" -o /tmp/tools.tar.gz; then
          echo "tools bundle fetched"; break
        fi
      fi
      echo "tools fetch attempt $i failed; retrying in 15s..."; sleep 15
    done
  - mkdir -p /home/guser/tools
  - tar -xzf /tmp/tools.tar.gz -C /home/guser
  - chown -R guser:guser /home/guser/tools
  - sudo pwsh /home/guser/tools/update.ps1 -Run

  # Install dotnet-stack global tool for guser (PATH persisted via /etc/profile.d/dotnet-tools.sh)
  - sudo -u guser dotnet tool install --global dotnet-stack