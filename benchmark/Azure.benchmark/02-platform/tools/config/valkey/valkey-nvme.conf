# Valkey/Redis - AOF+RDB on local NVMe Cluster Configuration
# Placeholders: $eth1 (per-node), $port (per-instance), $nvme (local NVMe mount)
# Requires: setup-nvme.ps1 to discover + mount the ephemeral NVMe before starting.
# NOTE: Local NVMe is ephemeral (data lost on VM deallocation) - scratch use only.

bind $eth1
port $port
protected-mode no
daemonize yes
logfile /home/guser/valkey-cluster/$port/valkey.log
dir $nvme/valkey-cluster/$port

# Cluster
cluster-enabled yes
cluster-config-file nodes-$port.conf
cluster-node-timeout 5000
cluster-announce-ip $eth1

# Persistence (AOF + RDB on local NVMe)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory-policy allkeys-lru

# Performance
io-threads 6
io-threads-do-reads yes
tcp-backlog 16384
hz 100
