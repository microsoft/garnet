{
  "Address": "$eth1",
  "Port": $port,
  "EnableCluster": true,
  "ClusterConfigFlushFrequencyMs": -1,

  "DeviceType": "Null",
  "EnableStorageTier": false,
  /* Resolved by mcluster.ps1: floor(MemTotal bytes * 0.8) - AofMemorySize. One instance per VM. */
  "LogMemorySize": "$logMemorySize",
  "IndexMemorySize": "128m",
  "PageSize": "16m",
  "EnableReadCache": false,
  "Recover": false,
  "CheckpointDir": "/dev/shm/garnet-cluster/$port",
  "CheckpointFrequencySecs": 0,
  "CompactionFrequencySecs": 0,

  "EnableAOF": true,
  "UseAofNullDevice": true,
  "FastAofTruncate": true,
  "OnDemandCheckpoint": false,
  "AofPhysicalSublogCount": 1,
  "AofMemorySize": "1g",
  "AofPageSize": "32m",
  "CommitFrequencyMs": -1,
  "WaitForCommit": false,
  /* Bound shipping and replay backlogs below the AOF buffer; slow replicas throttle writers. */
  "AofSyncMaxLagBytes": 268435456,
  "AofReplayMaxLagBytes": 268435456,
  "ReplicaDisklessSync": true,

  "FileLogger": null,
  "DisableConsoleLogger": false,
  "MetricsSamplingFrequency": 1
}
