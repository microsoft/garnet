{
  "Address": "$eth1",
  "Port": $port,
  "EnableCluster": true,
  "EnableStorageTier": false,
  "IndexSize": "1g",
  "LogMemorySize": "16g",
  "GossipSamplePercent": 50,
  "MetricsSamplingFrequency": 5,
  "LogLevel" : "Trace",

  /* AOF Config */
  "EnableAOF": true,
  "UseAofNullDevice": true,
  "FastAofTruncate": true,
  "CommitFrequencyMs": -1,  
  "AofPhysicalSublogCount": 16,  
  /* Timeout associated with replication stream sync operations*/
  "ReplicaSyncTimeout": 60,  

  /* Primary Specific Config */
  /* SpinWait duration for checking for new records and shipping AOF log at primary */
  "ReplicaSyncDelayMs": 0,
  /* Frequency of advance time pulse for idle sublogs */
  "AofTailWitnessFreqMs": 0,  
  /* Stall primary AOF appends when the replication lag exceeds this budget, divided evenly per sublog (each sublog stalls at an even 1/m share). -1: disabled, >=1: max lag in bytes. */
  "AofSyncMaxLagBytes" : 268435456,

  /* Replica Specific Config */
  /* Controls Async Replay > 0 or == -1. Otherwise ==0 synchronous */
  "AofReplayMaxLagBytes": 268435456,
  /* Cross-sublog replay drift, in sequence-number units, tolerated on a replica before a replay-align barrier round is triggered. -1 disables the barrier. */
  "AofReplayDriftThreshold": 1024,
  /* How often cross-sublog drift is re-checked during replay, as a multiple of AofReplayDriftThreshold. 0 = readers about to wait are the only round source. */
  "AofReplayDriftCheckFreq": 1,
  /* How long a replay thread spins at the replay-align barrier before sleeping: -1 = spin forever, 0 = never spin, >0 = spin up to that many microseconds then sleep. */
  "AofReplayBarrierSpinUs": 1048576
}