{
  "Address": "$eth1",
  "Port": $port,
  "EnableCluster": true,

  /* Enable tiering of records (hybrid log) to local NVMe for a larger-than-memory store. */
  "EnableStorageTier": true,
  "IndexSize": "1g",
  "LogMemorySize": "16g",

  /* On-disk log sizing for the tiered (NVMe) segments. */
  "PageSize": "1g",
  "SegmentSize": "1g",

  /* When records are read from storage, copy them to the tail of the log. */
  "CopyReadsToTail": true,

  /* Storage directory for tiered records (hybrid log). Placed on local NVMe. */
  "LogDir": "$nvme/garnet-cluster/$port",

  /* Storage directory for checkpoints (and AOF device). Placed on local NVMe. */
  "CheckpointDir": "$nvme/garnet-cluster/$port/checkpoints",

  "GossipSamplePercent": 50,
  "MetricsSamplingFrequency": 5,

  /* AOF Config - single physical log persisted to NVMe (not the null device). */
  "EnableAOF": true,
  "UseAofNullDevice": false,
  "FastAofTruncate": true,
  "CommitFrequencyMs": -1,
  "AofPhysicalSublogCount": 1,
  "AofMemorySize": "16g",
  "AofPageSize": "128m"
}
