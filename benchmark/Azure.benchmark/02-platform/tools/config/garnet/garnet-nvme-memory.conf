{
  "Address": "$eth1",
  "Port": $port,
  "EnableCluster": true,
  "ClusterPreferredEndpointType": "hostname",
  "ClusterAnnounceHostname": "$eth1",

  "EnableStorageTier": true,
  "LogMemorySize": "64g",
  "IndexMemorySize": "8g",
  "PageSize": "16m",
  "SegmentSize": "1g",
  "EnableReadCache": false,
  "CopyReadsToTail": true,
  "LogDir": "$nvme/garnet-cluster/$port",

  /* Checkpoints, AOF, and persisted cluster metadata share the NVMe mount. */
  "CheckpointDir": "$nvme/garnet-cluster/$port/checkpoints",
  "EnableAOF": true,
  "UseAofNullDevice": false,
  "AofPhysicalSublogCount": 1,
  "AofMemorySize": "128m",
  "AofPageSize": "32m",
  "AofSegmentSize": "1g",
  "CommitFrequencyMs": 0,
  "WaitForCommit": false,
  "AofSizeLimit": "64g",
  "AofReplayMaxLagBytes": 0,

  "DeviceType": "Native",
  "DeviceIoBackend": "Uring",
  "DeviceUringSqPoll": false,
  "DeviceIoContexts": 256,
  "DeviceQueueDepth": 256,
  "DeviceCompletionThreads": 16,
  "DeviceThrottleLimit": 4096,
  "DeviceAioMaxDevices": 32,
  "EnableScatterGatherGet": true,
  "InitialIORecordSize": "8k",

  "ThreadPoolMinThreads": 512,
  "ThreadPoolMaxThreads": 2048,
  "NetworkConnectionLimit": -1,
  "ClusterReplicationReestablishmentTimeout": 10,
  "ReplicaAttachTimeout": 43200,
  "ReplicaSyncTimeout": 300,

  "CompactionFrequencySecs": 0,
  "CheckpointFrequencySecs": 0,
  "EnableVectorSetPreview": false,
  "LogLevel": "Debug",
  "FileLogger": "$nvme/garnet-cluster/$port/server.log",
  "DisableConsoleLogger": true,
  "MetricsSamplingFrequency": 1
}
