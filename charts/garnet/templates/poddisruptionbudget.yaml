{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "garnet.fullname" . }}
  labels:
    {{- include "garnet.labels" . | nindent 4 }}
spec:
  {{- /* Test against the empty-string sentinel, not truthiness: Go templates treat integer 0 as false, and 0 is a valid maxUnavailable. */}}
  {{- $maxUnavailable := .Values.podDisruptionBudget.maxUnavailable }}
  {{- if and (not (kindIs "invalid" $maxUnavailable)) (ne (toString $maxUnavailable) "") }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "garnet.selectorLabels" . | nindent 6 }}
{{- end }}
