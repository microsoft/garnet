# Default values for garnet.

statefulSet:
  # -- StatefulSet annotations
  annotations: {}
  # -- StatefulSet replicas
  replicas: 1
  # -- StatefulSet revisionHistoryLimit
  revisionHistoryLimit: 1
  updateStrategy:
    # -- StatefulSet updateStrategy type
    type: RollingUpdate

image:
  # -- Image registry
  registry: ghcr.io
  # -- Image repository
  repository: microsoft/garnet
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Chart name override
nameOverride: ""
# -- Chart full name override
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Automatically mount the service account token
  automount: false

config:
  # -- Garnet secret (if you want to use an existing secret).
  # This secret must contains a key called 'garnet.conf'.
  existingSecret: ""
  # -- The garnet.conf data content.
  garnetConf: ""
  #garnetConf: |
  #  {
  #    "AuthenticationMode": "Password",
  #    "Password": "aStrongPassword",
  #    "EnableStorageTier": true,
  #    "LogDir": "/data"
  #  }

containers:
  # -- Containers args
  args: []
  # -- Containers port
  port: 6379

# -- Startup probe (tcpSocket on the garnet port).
# Garnet only starts answering once checkpoint/AOF recovery finishes, which can
# take minutes for large datasets; this probe allows 5 minutes (periodSeconds 5
# x failureThreshold 60) before liveness takes over.
# Set to null to disable (for example `--set startupProbe=null`, or `startupProbe: null` in a values file).
startupProbe:
  tcpSocket:
    port: garnet
  periodSeconds: 5
  failureThreshold: 60

# -- Containers livenessProbe (tcpSocket on the garnet port); only takes over
# after startupProbe succeeds.
# Set to null to disable (for example `--set livenessProbe=null`, or `livenessProbe: null` in a values file).
livenessProbe:
  tcpSocket:
    port: garnet
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 3

# -- Containers readinessProbe (tcpSocket on the garnet port).
# Set to null to disable (for example `--set readinessProbe=null`, or `readinessProbe: null` in a values file).
readinessProbe:
  tcpSocket:
    port: garnet
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# -- Init containers
initContainers: []

# -- DNS config
dnsConfig: {}
# dnsConfig:
#   options:
#   - name: ndots
#     value: "1"
#   - name: edns0

# -- DNS policy
dnsPolicy: ClusterFirst

persistence:
  # -- persistence enabled
  enabled: false
  # -- The Storage directory for tiered records (hybrid log), if storage tiering (--storage-tier) is enabled.
  # Default: "/data"
  storageDir: ""

volumeClaimTemplates:
  # -- Volume Claim Templates Storage Class Name
  storageClassName: local-storage
  # -- Volume Claim Templates Requests Storage
  requestsStorage: 1Gi

# -- Pod annotations
podAnnotations: {}

# -- Pod Disruption Budget; disabled by default (a PDB with minAvailable 1 on a
# single replica would block node drains). Rendered only when enabled is true.
podDisruptionBudget:
  # -- Create a PodDisruptionBudget
  enabled: false
  # -- Minimum number/percentage of pods that must be available (used when
  # maxUnavailable is empty)
  minAvailable: 1
  # -- Maximum number/percentage of pods that may be unavailable; when set,
  # it is rendered instead of minAvailable
  maxUnavailable: ""

# -- Pod Security Context
podSecurityContext: {}
  # fsGroup: 2000

# -- Security Context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Service annotations
  annotations: {}
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 6379
  # -- Service ipFamilies
  ipFamilies:
  - IPv4
  # -- Service ipFamilyPolicy SingleStack|PreferDualStack|RequireDualStack
  ipFamilyPolicy: SingleStack

# -- Resources
resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 64Mi
  # requests:
  #   cpu: 10m
  #   memory: 16Mi

# -- Extra Volume Mounts
extraVolumeMounts: []

# -- Extra Volumes
extraVolumes: []

# -- Node Selector labels
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity
affinity: {}
