version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dotnet-deps:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # NUnit 5 requires a test migration: awaited async assertions and OrderAttribute replacement
      - dependency-name: "NUnit"
        update-types: ["version-update:semver-major"]
      # StackExchange.Redis 3.4 changes cluster routing (replica role detection, no redirects on IServer.Execute),
      # which the cluster tests need to be migrated for
      - dependency-name: "StackExchange.Redis"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      nuget-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    groups:
      website-deps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
