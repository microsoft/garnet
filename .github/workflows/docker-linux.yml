name: Garnet Docker images for Linux

on:
  workflow_dispatch: # allow manual run
  workflow_run:
    workflows: ['Garnet .NET CI']
    types: [completed]
    branches: [main]
  push:
    tags: 'v*'

jobs:
  docker:
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ghcr.io/${{ github.repository }}
            os: ubuntu-latest
          - dockerfile: Dockerfile.alpine
            image: ghcr.io/${{ github.repository }}-alpine
            os: ubuntu-latest
          - dockerfile: Dockerfile.ubuntu
            image: ghcr.io/${{ github.repository }}-noble
            os: ubuntu-latest
          - dockerfile: Dockerfile.chiseled
            image: ghcr.io/${{ github.repository }}-noble-chiseled
            os: ubuntu-latest
          - dockerfile: Dockerfile.azurelinux
            image: ghcr.io/${{ github.repository }}-azurelinux3.0
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.1.0 for security reasons we have pinned the tag (commit SHA) for 3rd party
        with:
          images: ${{ matrix.image }}
          tags: |
            # generate Docker tags based on the following events/attributes
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.1.0 for security reasons we have pinned the tag (commit SHA) for 3rd party
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.1.0 for security reasons we have pinned the tag (commit SHA) for 3rd party
      -
        name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.2.0 for security reasons we have pinned the tag (commit SHA) for 3rd party

        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.2.0 for security reasons we have pinned the tag (commit SHA) for 3rd party
        with:
          file: ${{ matrix.dockerfile }}
          provenance: false
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.ref_name == 'main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
