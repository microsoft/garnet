name: Garnet Docker images for Windows

on:
  workflow_dispatch: # allow manual run
  workflow_run:
    workflows: ['Garnet .NET CI']
    types: [completed]
    branches: [main]
  push:
    tags: 'v*'

permissions:
   contents: read
   packages: write

jobs:
  docker:
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.1.0 for security reasons we have pinned the tag (commit SHA) for 3rd party
        with:
          images: ghcr.io/${{ github.repository }}-nanoserver-ltsc2022
          tags: |
            # generate Docker tags based on the following events/attributes
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.2.0 for security reasons we have pinned the tag (commit SHA) for 3rd party
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push
        if: ${{ (github.ref_name == 'main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && github.event_name != 'pull_request' }}
        run: |
          docker build -f Dockerfile.nanoserver `
            --tag ${{ fromJSON(steps.meta.outputs.json).tags[0] }} `
            --tag ${{ fromJSON(steps.meta.outputs.json).tags[1] }} `
            --tag ${{ fromJSON(steps.meta.outputs.json).tags[2] }} .
          docker push ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker push ${{ fromJSON(steps.meta.outputs.json).tags[1] }}
          docker push ${{ fromJSON(steps.meta.outputs.json).tags[2] }}

      - name: Build Only
        if: ${{ !((github.ref_name == 'main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && github.event_name != 'pull_request') }}
        run: |
          docker build -f Dockerfile.nanoserver .
